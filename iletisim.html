<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İletişim - Programlar Sitesi</title>
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html">Ana Sayfa</a></li>
        </ul>
    </nav>

    <main>
        <h1>İletişim</h1>
        <p>Bize mesaj göndermek için aşağıdaki formu kullanabilirsiniz.</p>

        <!-- Web3Forms Formu -->
        <form action="https://api.web3forms.com/submit" method="POST">
            <!-- Access Key -->
            <input type="hidden" name="access_key" value="56a9509f-7b30-46e7-a000-86dd6bc0daed">
            
            <!-- Yönlendirmeyi iptal etmek için (opsiyoneldir, kaldırırsanız varsayılan sayfaya gitmez) -->
            <input type="hidden" name="redirect" value="https://web3forms.com/success"> 
            <!-- NOT: Eğer redirect inputunu komple silerseniz, 
                 Web3Forms kendi teşekkür sayfasını açar. 
                 Sayfada kalmak için AJAX (JavaScript) kullanmak gerekir. -->

            <p>
                <label for="isim">Adınız:</label><br>
                <input type="text" id="isim" name="name" required>
            </p>
            <p>
                <label for="email">E-posta Adresiniz:</label><br>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="mesaj">Mesajınız:</label><br>
                <textarea id="mesaj" name="message" rows="5" required></textarea>
            </p>
            <p>
                <button type="submit">Gönder</button>
            </p>
        </form>
    </main>

</body>
</html>
