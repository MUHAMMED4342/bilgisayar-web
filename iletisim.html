<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>İletişim - Programlar Sitesi</title>
    <meta name="description" content="Programlar Sitesi ile iletişime geçmek için form.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a class="skip-link" href="#icerik">İçeriğe geç</a>

    <header class="site-header">
        <div class="brand">
            <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
                <rect x="1" y="1" width="38" height="38" rx="9" fill="none" stroke="#5FBFA9" stroke-width="2"/>
                <path d="M8 24 L13 14 L17 27 L21 10 L25 30 L28 18 L32 22" fill="none" stroke="#5FBFA9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="brand-text">
                <p class="brand-title" style="font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:clamp(1.7rem,4vw,2.4rem); color:#fff; text-transform:uppercase; margin:0;">Programlar Sitesi</p>
                <p>Yazılımlar ve NVDA eklentileri</p>
            </div>
        </div>
        <nav class="site-nav" aria-label="Ana gezinme">
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="iletisim.html" aria-current="page">İletişim</a></li>
            </ul>
        </nav>
    </header>

    <main id="icerik">
        <div class="intro">
            <h1>İletişim</h1>
            <p>Bize mesaj göndermek için aşağıdaki formu kullanabilirsiniz.</p>
        </div>

        <!-- Web3Forms Formu -->
        <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
            <!-- Access Key -->
            <input type="hidden" name="access_key" value="56a9509f-7b30-46e7-a000-86dd6bc0daed">

            <!-- Yönlendirmeyi iptal etmek için -->
            <input type="hidden" name="redirect" value="https://web3forms.com/success">

            <div class="form-row">
                <label for="isim">Adınız:</label>
                <input type="text" id="isim" name="name" required autocomplete="name">
            </div>

            <div class="form-row">
                <label for="email">E-posta Adresiniz:</label>
                <!-- aria-describedby ile uyarıyı inputa bağladık, NVDA artık tab ile gelince okuyacaktır -->
                <input type="email" id="email" name="email" required aria-describedby="email-uyari" autocomplete="email">
                <small id="email-uyari" class="form-hint">Uyarı: Lütfen geçerli bir e-posta kullanın çünkü sizinle iletişime geçeceğiz.</small>
            </div>

            <div class="form-row">
                <label for="mesaj">Mesajınız:</label>
                <textarea id="mesaj" name="message" rows="5" required></textarea>
            </div>

            <button class="submit-btn" type="submit">Gönder</button>
        </form>
    </main>

    <footer class="site-footer">
        <p><a href="index.html">Ana sayfaya</a> dönebilirsiniz.</p>
    </footer>

</body>
</html>
